<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D9F5" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050B14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <!-- Shield Outline with glowing node -->
  <path d="M50 16 L76 26 C76 54 50 78 50 84 C50 78 24 54 24 26 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Geometric Core: TrustPay Interlocking T & P nodes -->
  <path d="M40 38 H60 M50 38 V62" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <path d="M50 48 H58 C62.4 48 65 45.3 65 41 C65 36.7 62.4 34 58 34" stroke="url(#shieldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="50" cy="72" r="3.5" fill="#00F5A0" />
</svg>